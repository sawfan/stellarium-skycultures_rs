[package]
name = "stellarium-skycultures"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rubrum-star-catalog = { path = "../rubrum-star-catalog" }

[dev-dependencies]
rubrum-star-catalog-hipparcos = { path = "../rubrum-star-catalog-hipparcos" }
